<!-- The shift's first row (index.qmd, From the IDE to the ADE): an
     editor's window as one has it today, seen from the front, each pane a
     box with its name in it: an activity bar, a file browser with the
     outline and the timeline folded under it, an editor of code, a
     terminal in the panel under the editor, and the agent chat squeezed
     into a pane at the right edge, one dial among the dials. Its words
     stand beside it, and the ADE's row under it (_shift-ade.html). The
     structure in the muted ink and the two borders, everything else in
     the shift's own set (css/theme.scss, --sk-*): ochre for the files,
     slate for the code, sage for the terminal, the lights in rose, ochre
     and sage, the accent on the agent chat. Its frame is heavier than the
     lines inside it, with a faint gray halo. The box under the pointer
     lights in place, its edge heavier and its name in the ink (css/theme.scss);
     on a phone the light walks the boxes on its own (js/shift.js).
     The strokes do not scale (css/theme.scss, The shift), so the hairline
     holds at any width. No blank line belongs in this file, and nothing
     under a div is indented four spaces: Pandoc reads what is between a
     div's tags as Markdown, so one would end the block and the other would
     make a code block of a line. -->
