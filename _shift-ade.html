<!-- The shift's second window (index.qmd, From the IDE to the ADE): the
     arrow from the IDE's window, across from 992 wide and down under it,
     centered on both windows, and
     Emaki's window, as the app draws it, seen from the front, each pane a
     box with its name in it: new chat and the chats in the sidebar, a
     project a folder with its chats stepped in under it along a guide line
     and one of them live, the folder a toggle that folds them up and out
     again, agent chat in the middle, and the four panels nowhere until
     the pointer finds their buttons in the chrome, files and outline at
     the main area's left end and the shell terminal and the agent terminal
     at the right, when each slides in from its side and the chat makes
     room, as the app's do; the two of a side share it, so one coming puts
     the other away; the next pass over a button sends its panel away
     again, and off the window everything goes. The buttons glow at rest,
     each in its panel's own color, as the panels are colored everywhere
     on the site: the files ochre, the outline mauve, the shell sage, the
     agent's terminal Claude's terracotta. The terminal is sage and the
     agent chat the accent, as in the IDE above, so the eye finds each in
     each: the one small at the edge, the other in the middle.
     The window carries the name, with the app's icon beside it, as its
     sidebar has them, and its frame and halo are the accent. The panes
     and the fold move by js/shift.js.
     The strokes do not scale (css/theme.scss, The shift), so the hairline
     holds at any width. No blank line belongs in this file, and nothing
     under a div is indented four spaces: Pandoc reads what is between a
     div's tags as Markdown, so one would end the block and the other would
     make a code block of a line. -->
